<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Pembayaran Kelas 7E</title>
  
  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .nav-btn.active {
      color: #4f46e5;
      position: relative;
    }
    .nav-btn.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 3px;
      background-color: #4f46e5;
      border-radius: 99px;
    }
    .toast-animate {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUp {
      from { transform: translate(-50%, 100%); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased pb-28">

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-30 bg-slate-900 text-white shadow-lg border-b border-slate-800">
    <div class="max-w-md mx-auto px-5 py-4 flex items-center">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center shadow-md">
          <i class="fas fa-file-invoice-dollar text-white text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight">Pembayaran Kelas 7E</h1>
          <p class="text-[11px] text-slate-400 font-medium">Manajemen Pembayaran Siswa</p>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-md mx-auto px-4 pt-5">

    <!-- TAB 1: FORM INPUT TRANSAKSI -->
    <section id="tab-input" class="tab-content">
      <div class="glass-card rounded-2xl p-5 shadow-sm space-y-4">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <h2 class="text-sm font-bold text-slate-800 flex items-center">
            <span class="w-2 h-2 rounded-full bg-indigo-600 mr-2"></span>
            Catat Pembayaran Baru
          </h2>
          <span class="text-[11px] bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full font-semibold">Form Input</span>
        </div>

        <form id="formBayar" class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Nama Siswa</label>
            <div class="relative">
              <select id="namaSiswa" required class="w-full pl-3 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none appearance-none">
                <option value="">-- Pilih Nama Siswa --</option>
              </select>
              <i class="fas fa-chevron-down absolute right-3 top-3 text-slate-400 text-xs pointer-events-none"></i>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Keperluan Pembayaran</label>
            <div class="relative">
              <select id="keperluan" required class="w-full pl-3 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none appearance-none">
                <option value="">-- Pilih Keperluan --</option>
                <option value="SPP">SPP</option>
                <option value="Study Tour">Study Tour (Target: Rp 1.400.000)</option>
                <option value="LKS">LKS</option>
                <option value="Buku 7KAIH">Buku 7KAIH</option>
                <option value="Kalender">Kalender</option>
              </select>
              <i class="fas fa-chevron-down absolute right-3 top-3 text-slate-400 text-xs pointer-events-none"></i>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Jumlah Uang (Rp)</label>
            <div class="relative">
              <span class="absolute left-3 top-2.5 text-xs font-bold text-slate-400">Rp</span>
              <input type="number" id="jumlah" required placeholder="0" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Jam / Waktu Transfer</label>
            <input type="text" id="waktuTransfer" placeholder="Misal: 10:15 WIB / Kemarin" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Status Pengambilan</label>
            <div class="relative">
              <select id="statusAwal" required class="w-full pl-3 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none appearance-none">
                <option value="Belum Diambil">Belum Diambil</option>
                <option value="Sudah Diambil">Sudah Diambil</option>
                <option value="Belum Upload">Belum Upload (SPP)</option>
                <option value="Sudah Upload">Sudah Upload (SPP)</option>
              </select>
              <i class="fas fa-chevron-down absolute right-3 top-3 text-slate-400 text-xs pointer-events-none"></i>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Catatan Tambahan (Opsional)</label>
            <input type="text" id="catatan" placeholder="Nomor kuitansi / info tambahan..." class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none">
          </div>

          <button type="submit" id="btnSimpan" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 rounded-xl text-xs shadow-md transition cursor-pointer flex items-center justify-center space-x-2">
            <i class="fas fa-paper-plane"></i>
            <span>Simpan & Upload</span>
          </button>
        </form>
      </div>
    </section>

    <!-- TAB 2: RIWAYAT TRANSAKSI -->
    <section id="tab-transaksi" class="tab-content hidden space-y-3">
      <div class="relative">
        <i class="fas fa-search absolute left-3.5 top-3 text-slate-400 text-xs"></i>
        <input type="text" id="searchTrans" placeholder="Cari nama siswa atau keperluan..." class="w-full pl-9 pr-4 py-2.5 bg-white border border-slate-200 rounded-2xl text-xs font-semibold shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
      </div>

      <div id="listTransaksi" class="space-y-3"></div>
    </section>

    <!-- TAB 3: FILTER PER ANAK -->
    <section id="tab-filter" class="tab-content hidden space-y-4">
      <div class="glass-card rounded-2xl p-4 shadow-sm">
        <label class="block text-xs font-bold text-slate-700 mb-2">Pilih Nama Siswa:</label>
        <div class="relative">
          <select id="filterSiswa" class="w-full pl-3 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none">
            <option value="">-- Pilih Nama Siswa --</option>
          </select>
          <i class="fas fa-chevron-down absolute right-3 top-3 text-slate-400 text-xs pointer-events-none"></i>
        </div>
      </div>

      <div id="rekapAnakContainer" class="hidden space-y-3">
        <div class="bg-gradient-to-r from-slate-900 to-indigo-950 text-white p-4 rounded-2xl shadow-md flex justify-between items-center">
          <div>
            <h3 id="rekapNamaAnak" class="font-extrabold text-sm text-indigo-200"></h3>
            <p class="text-[11px] text-slate-400 mt-0.5">Rekapitulasi Pembayaran Siswa</p>
          </div>
          <div class="text-right">
            <span class="text-[10px] text-slate-400 block uppercase font-bold">Total Masuk</span>
            <span id="rekapTotalSiswa" class="text-xs font-bold text-emerald-400">Rp 0</span>
          </div>
        </div>

        <div id="studyTourStatusCard" class="hidden p-4 rounded-2xl border transition-all">
          <div class="flex justify-between items-center">
            <div>
              <span class="text-[10px] uppercase font-bold text-slate-500 block">Status Study Tour</span>
              <span id="studyTourBayarLabel" class="text-xs font-extrabold text-slate-800">Rp 0 / Rp 1.400.000</span>
            </div>
            <div id="studyTourBadge" class="text-xs px-2.5 py-1 rounded-full font-bold"></div>
          </div>
          <div id="studyTourKurangInfo" class="mt-2 pt-2 border-t text-xs font-bold flex justify-between items-center"></div>
        </div>

        <div id="listRekapAnak" class="space-y-2"></div>
      </div>
    </section>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 z-50">
    <div class="max-w-md mx-auto flex justify-around py-2.5">
      <button type="button" data-tab="input" class="nav-btn active flex flex-col items-center text-slate-400 text-[11px] font-bold cursor-pointer transition">
        <i class="fas fa-plus-circle text-base mb-1"></i> Input
      </button>
      <button type="button" data-tab="transaksi" class="nav-btn flex flex-col items-center text-slate-400 text-[11px] font-bold cursor-pointer transition">
        <i class="fas fa-receipt text-base mb-1"></i> Riwayat
      </button>
      <button type="button" data-tab="filter" class="nav-btn flex flex-col items-center text-slate-400 text-[11px] font-bold cursor-pointer transition">
        <i class="fas fa-user-check text-base mb-1"></i> Per Anak
      </button>
    </div>
  </nav>

  <!-- MODAL KONFIRMASI HAPUS -->
  <div id="deleteModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl space-y-4">
      <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto text-red-500">
        <i class="fas fa-exclamation-triangle text-xl"></i>
      </div>
      <div class="text-center">
        <h3 class="text-sm font-bold text-slate-800">Hapus Transaksi?</h3>
        <p id="deleteTargetText" class="text-xs text-slate-500 mt-1">Data yang dihapus dari cloud tidak dapat dikembalikan.</p>
      </div>
      <div class="flex space-x-2 pt-2">
        <button id="btnCancelDelete" class="w-1/2 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition">Batal</button>
        <button id="btnConfirmDelete" class="w-1/2 py-2 bg-red-500 hover:bg-red-600 text-white text-xs font-bold rounded-xl transition">Hapus</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFIKASI -->
  <div id="toast" class="fixed bottom-16 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg z-50 hidden items-center space-x-2">
    <i id="toastIcon" class="fas fa-check-circle text-emerald-400"></i>
    <span id="toastMsg">Berhasil!</span>
  </div>

  <script>
    const BIAYA_STUDY_TOUR = 1400000;

    const daftarSiswa = [
      "Adwa Najwa", "Agha Abizar", "Ahza Alvino", "Aili Omi", "Akbar Caesar",
      "AlfaridzyAlifiya", "Anggen", "Jenita", "Chyntia", "Daffa", "Damar",
      "Deshifa Zhahira", "Earlita", "Elang", "Fakhira", "Fernando", "Gandes",
      "Juvendio", "Kenzy", "Luthfia", "M. Gavin", "M. Rizqi", "Naira",
      "Queen Qimora", "Raditya", "Raffael", "Rico", "Syabil", "Syahnaz", "Zainab"
    ];

    // ALAMAT SINGAPORE FIREBASE RESMI
    const FIREBASE_DB_URL = "https://kas-sekolah-70083-default-rtdb.asia-southeast1.firebasedatabase.app/transaksi";

    let semuaTransaksi = [];
    let deleteIdTarget = null;

    function showToast(msg, iconClass = "fa-check-circle text-emerald-400") {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      
      toastMsg.innerText = msg;
      toastIcon.className = "fas " + iconClass;
      
      toast.classList.remove('hidden');
      toast.classList.add('flex', 'toast-animate');
      
      setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex', 'toast-animate');
      }, 3000);
    }

    function initDropdowns() {
      const formSelect = document.getElementById('namaSiswa');
      const filterSelect = document.getElementById('filterSiswa');

      formSelect.innerHTML = '<option value="">-- Pilih Nama Siswa --</option>';
      filterSelect.innerHTML = '<option value="">-- Pilih Nama Siswa --</option>';

      daftarSiswa.forEach(nama => {
        const opt1 = document.createElement('option');
        opt1.value = nama;
        opt1.textContent = nama;
        formSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = nama;
        opt2.textContent = nama;
        filterSelect.appendChild(opt2);
      });
    }

    // Mengambil data murni langsung dari Cloud Firebase (Tanpa LocalStorage)
    async function fetchFromFirebase() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}.json`);
        if (res.ok) {
          const data = await res.json();
          const remoteTrans = [];
          if (data) {
            Object.keys(data).forEach(key => {
              if (data[key]) {
                remoteTrans.push({ id: key, ...data[key] });
              }
            });
          }
          semuaTransaksi = remoteTrans;
          updateUI();
        }
      } catch (err) {
        console.warn("Gagal terhubung ke Cloud Firebase.");
      }
    }

    // Sinkronisasi Real-Time (Setiap 2 detik sinkron otomatis ke semua HP & Laptop)
    function startRealtimeSync() {
      fetchFromFirebase();
      setInterval(fetchFromFirebase, 2000);
    }

    function updateUI() {
      renderTransaksi();
      renderFilterAnak();
    }

    function renderTransaksi() {
      const container = document.getElementById('listTransaksi');
      const searchInput = document.getElementById('searchTrans');
      const keyword = searchInput ? searchInput.value.toLowerCase() : '';

      container.innerHTML = '';

      const filtered = semuaTransaksi.filter(t => 
        (t.namaSiswa && t.namaSiswa.toLowerCase().includes(keyword)) ||
        (t.keperluan && t.keperluan.toLowerCase().includes(keyword))
      );

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-400">
            <i class="fas fa-inbox text-4xl mb-2"></i>
            <p class="text-xs">Belum ada riwayat transaksi di Cloud.</p>
          </div>`;
        return;
      }

      const sorted = [...filtered].reverse();

      sorted.forEach(t => {
        let badgeColor = 'bg-amber-50 text-amber-700 border-amber-200';
        if (t.status === 'Sudah Upload' || t.status === 'Sudah Diambil' || t.status === 'Lunas') {
          badgeColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';
        }

        let nextActionText = '';
        let nextStatusVal = '';
        if (t.status === 'Belum Upload') {
          nextActionText = 'Tandai Upload';
          nextStatusVal = 'Sudah Upload';
        } else if (t.status === 'Belum Diambil') {
          nextActionText = 'Tandai Diambil';
          nextStatusVal = 'Sudah Diambil';
        } else if (t.status === 'Sudah Diambil') {
          nextActionText = 'Tandai Belum Diambil';
          nextStatusVal = 'Belum Diambil';
        }

        const card = document.createElement('div');
        card.className = "glass-card rounded-2xl p-4 shadow-sm space-y-2 border border-slate-100 transition hover:shadow-md";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h4 class="font-extrabold text-slate-800 text-xs">${t.namaSiswa}</h4>
              <span class="inline-block px-2 py-0.5 text-[10px] font-bold bg-indigo-50 text-indigo-600 rounded-md mt-1">${t.keperluan}</span>
            </div>
            <div class="text-right">
              <span class="font-black text-indigo-600 text-xs block">Rp ${(Number(t.jumlah) || 0).toLocaleString('id-ID')}</span>
              <button type="button" onclick="openDeleteModal('${t.id}', '${t.namaSiswa}')" class="text-red-400 hover:text-red-600 text-[11px] mt-1 font-semibold transition cursor-pointer">
                <i class="fas fa-trash-alt mr-0.5"></i> Hapus
              </button>
            </div>
          </div>
          
          <div class="text-[10px] text-slate-400 flex justify-between font-medium pt-1">
            <span><i class="far fa-clock mr-1"></i>TF: ${t.waktuTransfer || '-'}</span>
            <span>Input: ${t.waktuInput || '-'}</span>
          </div>

          ${t.catatan ? `<p class="text-[10px] text-slate-400 italic">Catatan: ${t.catatan}</p>` : ''}

          <div class="pt-2 border-t border-slate-100 flex justify-between items-center">
            <span class="text-[10px] px-2.5 py-0.5 rounded-full font-bold border ${badgeColor}">${t.status}</span>
            ${nextActionText ? `
              <button type="button" onclick="ubahStatus('${t.id}', '${nextStatusVal}')" class="text-[10px] bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1 rounded-lg shadow-sm transition cursor-pointer">
                <i class="fas fa-check-circle mr-1"></i> ${nextActionText}
              </button>
            ` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderFilterAnak() {
      const select = document.getElementById('filterSiswa');
      const nama = select ? select.value : '';
      const container = document.getElementById('rekapAnakContainer');
      const listContainer = document.getElementById('listRekapAnak');
      const studyTourCard = document.getElementById('studyTourStatusCard');
      const studyTourBadge = document.getElementById('studyTourBadge');
      const studyTourKurangInfo = document.getElementById('studyTourKurangInfo');
      const studyTourBayarLabel = document.getElementById('studyTourBayarLabel');

      if (!nama) {
        container.classList.add('hidden');
        return;
      }

      const siswaTrans = semuaTransaksi.filter(t => t.namaSiswa === nama);
      let totalSiswa = 0;
      let totalStudyTour = 0;

      document.getElementById('rekapNamaAnak').innerText = nama;
      listContainer.innerHTML = '';

      if (siswaTrans.length === 0) {
        listContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Belum ada riwayat transaksi untuk siswa ini.</p>';
        studyTourCard.classList.add('hidden');
      } else {
        siswaTrans.forEach(t => {
          const jml = Number(t.jumlah || 0);
          totalSiswa += jml;

          if (t.keperluan === 'Study Tour') {
            totalStudyTour += jml;
          }

          const item = document.createElement('div');
          item.className = "bg-white p-3 rounded-xl border border-slate-200 text-xs flex justify-between items-center shadow-sm";
          item.innerHTML = `
            <div>
              <p class="font-extrabold text-slate-800">${t.keperluan} <span class="font-normal text-slate-400">(${t.waktuTransfer})</span></p>
              <p class="text-[10px] text-slate-500 mt-0.5">Status: <b class="text-indigo-600">${t.status}</b></p>
            </div>
            <span class="font-bold text-slate-700">Rp ${jml.toLocaleString('id-ID')}</span>
          `;
          listContainer.appendChild(item);
        });

        studyTourCard.classList.remove('hidden');
        studyTourBayarLabel.innerText = `Rp ${totalStudyTour.toLocaleString('id-ID')} / Rp ${BIAYA_STUDY_TOUR.toLocaleString('id-ID')}`;

        if (totalStudyTour >= BIAYA_STUDY_TOUR) {
          studyTourCard.className = "p-4 rounded-2xl border bg-emerald-50 border-emerald-200 transition-all";
          studyTourBadge.className = "text-xs px-2.5 py-1 rounded-full font-bold bg-emerald-100 text-emerald-800";
          studyTourBadge.innerText = "LUNAS";
          studyTourKurangInfo.className = "mt-2 pt-2 border-t border-emerald-200 text-xs font-bold flex justify-between items-center text-emerald-800";
          studyTourKurangInfo.innerHTML = `<span><i class="fas fa-check-circle mr-1"></i>Pembayaran Lunas</span><span>Rp 0</span>`;
        } else {
          const kurang = BIAYA_STUDY_TOUR - totalStudyTour;
          studyTourCard.className = "p-4 rounded-2xl border bg-amber-50 border-amber-200 transition-all";
          studyTourBadge.className = "text-xs px-2.5 py-1 rounded-full font-bold bg-amber-100 text-amber-800";
          studyTourBadge.innerText = "BELUM LUNAS";
          studyTourKurangInfo.className = "mt-2 pt-2 border-t border-amber-200 text-xs font-bold flex justify-between items-center text-amber-900";
          studyTourKurangInfo.innerHTML = `<span><i class="fas fa-exclamation-circle mr-1 text-amber-600"></i>Sisa Kekurangan:</span><span class="text-red-600 font-extrabold">Rp ${kurang.toLocaleString('id-ID')}</span>`;
        }
      }

      document.getElementById('rekapTotalSiswa').innerText = 'Rp ' + totalSiswa.toLocaleString('id-ID');
      container.classList.remove('hidden');
    }

    // UPLOAD LANGSUNG KE FIREBASE (TANPA LOCALSTORAGE)
    document.getElementById('formBayar').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('btnSimpan');
      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Mengunggah...`;

      const idBaru = 'tr_' + Date.now();
      const payload = {
        id: idBaru,
        namaSiswa: document.getElementById('namaSiswa').value,
        keperluan: document.getElementById('keperluan').value,
        jumlah: Number(document.getElementById('jumlah').value),
        waktuTransfer: document.getElementById('waktuTransfer').value,
        catatan: document.getElementById('catatan').value,
        status: document.getElementById('statusAwal').value,
        waktuInput: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
      };

      try {
        const res = await fetch(`${FIREBASE_DB_URL}/${idBaru}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          this.reset();
          showToast("Berhasil Disimpan & Terunggah!");
          switchTab('transaksi');
          await fetchFromFirebase();
        } else {
          alert("Gagal mengunggah ke Firebase. Pastikan Rules Firebase sudah 'true'.");
        }
      } catch(err) {
        alert("Gagal mengunggah. Periksa koneksi internet Anda.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fas fa-paper-plane"></i> <span>Simpan & Upload Ke Firebase</span>`;
      }
    });

    async function ubahStatus(id, statusBaru) {
      try {
        await fetch(`${FIREBASE_DB_URL}/${id}/status.json`, {
          method: 'PUT',
          body: JSON.stringify(statusBaru)
        });
        showToast(`Status diubah jadi '${statusBaru}'`);
        await fetchFromFirebase();
      } catch(e) {
        alert("Gagal memperbarui status ke cloud.");
      }
    }

    function openDeleteModal(id, nama) {
      deleteIdTarget = id;
      document.getElementById('deleteTargetText').innerText = `Hapus transaksi milik "${nama}"?`;
      document.getElementById('deleteModal').classList.remove('hidden');
    }

    document.getElementById('btnCancelDelete').addEventListener('click', () => {
      document.getElementById('deleteModal').classList.add('hidden');
      deleteIdTarget = null;
    });

    document.getElementById('btnConfirmDelete').addEventListener('click', async () => {
      if (deleteIdTarget) {
        const targetId = deleteIdTarget;
        deleteIdTarget = null;
        document.getElementById('deleteModal').classList.add('hidden');

        try {
          await fetch(`${FIREBASE_DB_URL}/${targetId}.json`, {
            method: 'DELETE'
          });
          showToast("Transaksi Dihapus dari Cloud", "fa-trash-alt text-red-400");
          await fetchFromFirebase();
        } catch(e) {
          alert("Gagal menghapus dari cloud.");
        }
      }
    });

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab-' + tabName).classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('active', 'text-indigo-600');
        btn.classList.add('text-slate-400');
      });

      const activeBtn = document.querySelector(`[data-tab="${tabName}"]`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('active', 'text-indigo-600');
      }
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        switchTab(this.getAttribute('data-tab'));
      });
    });

    document.getElementById('searchTrans').addEventListener('keyup', renderTransaksi);
    document.getElementById('filterSiswa').addEventListener('change', renderFilterAnak);

    window.addEventListener('DOMContentLoaded', () => {
      initDropdowns();
      startRealtimeSync();
    });
  </script>
</body>
</html>
